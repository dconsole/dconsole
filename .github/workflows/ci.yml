name: CI

# Fast cross-platform build + test on every push to main and every
# pull request. Mainly here to catch Windows regressions — the release
# workflow runs on macOS only (for Apple notarization), so Windows
# issues otherwise slip through to users via brew/go install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      # Don't short-circuit — a Windows-only failure is useful to see
      # even while macOS/linux still pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        # -count=1 bypasses the test cache so each matrix leg really
        # exercises its own OS instead of reusing a cached pass. The
        # suite is small enough (~30s) that this is cheap.
        run: go test -count=1 ./...
