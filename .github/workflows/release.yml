name: release

# Cuts a GitHub release with cross-platform binaries whenever a `vX.Y.Z`
# tag is pushed. Goreleaser config lives at .goreleaser.yml.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Opt into Node.js 24 for all JS-based actions (checkout, setup-go,
  # goreleaser-action). Forced default from June 2026; opting in early
  # silences the per-run deprecation warnings and forward-tests our
  # pipeline.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  goreleaser:
    # macos-latest because the goreleaser notarize block shells to
    # `codesign` and `xcrun notarytool` — both macOS-only. Public
    # repos get free unlimited macOS minutes so the runner upgrade
    # has no billing cost. If the signing secrets aren't set the
    # notarize block silently skips and the build is the same as it
    # would be on ubuntu-latest.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so goreleaser can build the changelog from
          # commits since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on dconsole/homebrew-tap. Required so
          # goreleaser can push the updated Formula/dconsole.rb cross-repo.
          # Default GITHUB_TOKEN can't write outside this repo.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # macOS Developer ID code-signing certificate (base64-encoded
          # .p12) + its password. Used by the notarize: block in
          # .goreleaser.yml to sign the darwin_all universal binary
          # before notarization. Absent → notarize block auto-disables
          # via isEnvSet and the build ships unsigned (same as before).
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # App Store Connect API key for `xcrun notarytool submit`.
          # Generated at appstoreconnect.apple.com → Users and Access
          # → Integrations → Team Keys.
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
