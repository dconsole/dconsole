# goreleaser config — cuts cross-platform binaries on every `git tag vX.Y.Z`
# push via .github/workflows/release.yml. Run locally with:
#   goreleaser release --snapshot --clean
# (snapshot mode skips the actual GitHub publish.)

version: 2

project_name: dconsole

before:
  hooks:
    - go mod tidy

builds:
  # dconsole — the main CLI. The dconsole-echo reference plugin
  # stays in-tree under examples/ but isn't shipped as a release
  # artifact; plugin authors build it themselves when they need it.
  - id: dconsole
    main: ./cmd/dconsole
    binary: dconsole
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64  # uncommon; skip until someone asks

# Merge the two macOS slices into one fat Mach-O via `lipo`. Result is
# a single `darwin_all` archive containing a binary that runs natively
# on both Intel and Apple Silicon — the homebrew-style convention for
# Mac CLI tools. replace: true removes the per-arch darwin binaries so
# we don't ship three macOS archives.
universal_binaries:
  - id: dconsole-universal
    ids: [dconsole]
    name_template: dconsole
    replace: true

archives:
  - id: dconsole
    ids: [dconsole, dconsole-universal]
    name_template: >-
      dconsole_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README*
      - LICENSE*
      - docs/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Push a Homebrew formula to dconsole/homebrew-tap on every (non-pre)
# release. Users install with:
#   brew tap dconsole/tap
#   brew install dconsole
# Requires a HOMEBREW_TAP_GITHUB_TOKEN secret on this repo with
# `contents:write` on the tap repo. Default GITHUB_TOKEN can't push
# cross-repo.
brews:
  - name: dconsole
    repository:
      owner: dconsole
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/dconsole/dconsole
    description: Transport-agnostic CLI proxy for Drupal — one command surface across ssh, ddev, lando, docker, kubectl, and subprocess plugins.
    license: GPL-2.0-only
    skip_upload: auto  # skip on prereleases / snapshot
    commit_author:
      name: dconsole-bot
      email: noreply@github.com
    commit_msg_template: "dconsole {{ .Tag }}"
    install: |
      bin.install "dconsole"
    test: |
      assert_match "dconsole", shell_output("#{bin}/dconsole --version")

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: New features
      regexp: '^.*?(feat|add)(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?(fix|bug)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 99

release:
  github:
    owner: dconsole
    name: dconsole
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## dconsole {{.Tag}}

    Cross-platform binaries for darwin/linux/windows on amd64/arm64.

    ### Install

    Download the archive for your OS+arch, extract `dconsole` into a directory on `$PATH`, e.g.:

    ```sh
    tar -xzf dconsole_{{.Version}}_darwin_arm64.tar.gz
    mv dconsole ~/.local/bin/
    ```

    Verify with `dconsole --version`.

  footer: |
    **Full Changelog**: https://github.com/dconsole/dconsole/compare/{{.PreviousTag}}...{{.Tag}}
