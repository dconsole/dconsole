# CodeRabbit configuration — https://docs.coderabbit.ai/guides/configure-coderabbit
# Apply by installing the CodeRabbit GitHub App at
# https://github.com/apps/coderabbitai (free for public repos).

language: en
early_access: false
tone_instructions: |
  Concise and direct. Skip pleasantries. Lead with the issue, then the fix.
  Don't praise — flag what's wrong or what could be better. Match the tone
  of an experienced senior reviewing a peer.

reviews:
  profile: assertive          # assertive | chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false                 # disable the cute summary poem
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false             # only review PRs marked ready for review
    base_branches:
      - main

  path_instructions:
    - path: "**/*.go"
      instructions: |
        Go-specific review pointers:
        - Idiomatic error handling — wrap with %w, no log.Fatal in libraries.
        - Avoid premature abstraction; the project values straight-line code
          over interface gymnastics until a second concrete caller appears.
        - Check transport.Pipe / transport.Exec callers wire stderr through
          to surface remote errors (the codebase had a regression here).
        - For new commands, ensure --root / --uri forwarding via
          augmentDrushContext when calling drush.
    - path: "internal/dbcache/**"
      instructions: |
        Cache code must be atomic (tmp + rename) and key-isolated by every
        input that changes dump content (site, env, strategy, database,
        structure_tables). Flag any Put that writes directly to the final path.
    - path: ".github/workflows/**"
      instructions: |
        Pin actions to a tag (not @main). Default GITHUB_TOKEN won't cascade
        into other workflows — flag if a release-trigger workflow depends on
        another workflow's release event.

chat:
  auto_reply: true
